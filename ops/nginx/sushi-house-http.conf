limit_req_zone $binary_remote_addr zone=sushi_login:10m rate=5r/m;

server {
    server_name 5-129-249-100.sslip.io;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /login {
        limit_req zone=sushi_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/5-129-249-100.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5-129-249-100.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name 5-129-249-100.sslip.io;
    return 301 https://$host$request_uri;
}
